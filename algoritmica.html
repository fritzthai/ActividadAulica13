<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parte A — Sumatoria con JavaScript</title>
  <link rel="stylesheet" href="algoritmica.css">
</head>
<body>
  <main class="contenedor">
    <section class="tarjeta" aria-labelledby="titulo">
      <span class="etiqueta">Parte A · Algorítmica</span>
      <h1 id="titulo">Sumatoria de dos números</h1>
      <p class="descripcion">
        Ingresá dos valores numéricos. JavaScript calculará la suma e indicará
        si el resultado es positivo, cero o negativo, sin recargar la página.
      </p>

      <div class="campos">
        <div class="campo">
          <label for="numero1">Primer número</label>
          <input type="number" id="numero1" value="0">
        </div>

        <div class="campo">
          <label for="numero2">Segundo número</label>
          <input type="number" id="numero2" value="0">
        </div>
      </div>

      <button type="button" id="calcular">Calcular sumatoria</button>

      <div class="resultado-contenedor" aria-live="polite">
        <strong>Resultado:</strong>
        <span id="resultado" class="cero">Esperando el cálculo</span>
      </div>
    </section>
  </main>

  <script src="algoritmica.js"></script>
</body>
</html>
